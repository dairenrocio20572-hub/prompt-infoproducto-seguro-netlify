<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Estamos preparando una nueva experiencia de aprendizaje.">
  <title>Próximamente | Tu próximo paso</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #172b35; background: #f5f3ec; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 28px; }
    main { width: min(100%, 760px); }
    .tag { display: inline-block; padding: 9px 15px; border: 1px solid #c6d3cc; border-radius: 99px; color: #285e4a; font-size: .85rem; }
    h1 { font-size: clamp(2.6rem, 8vw, 5.2rem); line-height: 1.05; letter-spacing: -.055em; margin: 30px 0 24px; }
    p { max-width: 530px; font-size: 1.15rem; line-height: 1.65; color: #52636a; }
    .line { width: 72px; height: 5px; background: #e29b52; border-radius: 4px; margin: 36px 0; }
    footer { font-size: .85rem; color: #65756e; margin-top: 56px; }
  </style>
</head>
<body>
  <main>
    <span class="tag">PRÓXIMAMENTE</span>
    <h1>Tu próximo paso<br>empieza aquí.</h1>
    <div class="line" aria-hidden="true"></div>
    <p>Estamos preparando una nueva experiencia para aprender, avanzar y transformar tus ideas en resultados.</p>
    <footer>Sitio en preparación. El producto y sus contenidos estarán disponibles más adelante.</footer>
  </main>
</body>
</html>
